<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nalira Favicon — Simplified 7C mark for 16-48px legibility -->
  <defs>
    <linearGradient id="fw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="fd" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
  </defs>
  <!-- Orbit arc (simplified, thicker for small sizes) -->
  <circle cx="32" cy="32.5" r="25" fill="none" stroke="url(#fo)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="123 35" stroke-dashoffset="10" opacity="0.5"/>
  <!-- N/Wave mark (bold, readable at 16px) -->
  <path d="M 20 45 C 18 36, 18 26, 23 21 C 27 16, 31 24, 34 32 C 37 40, 40 46, 43 43 C 46 41, 47 30, 45 22" fill="none" stroke="url(#fw)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Orbit dot -->
  <circle cx="50" cy="13" r="3.2" fill="url(#fd)"/>
</svg>
