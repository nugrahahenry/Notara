<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="nl-ha-title nl-ha-desc" data-system="nalira-home-ambient" data-version="0.3" data-depth="outward" data-state="continuation">
  <title id="nl-ha-title">Nalira Folded Light Outward Bloom</title>
  <desc id="nl-ha-desc">Source fragments settle into a clearly open book. The right page opens outward and light radiates away from the spine.</desc>
  <defs>
    <linearGradient id="nl-ha-left-page" x1="104" y1="72" x2="330" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#FBFAFF"/>
      <stop offset="1" stop-color="#EEEAFB"/>
    </linearGradient>
    <linearGradient id="nl-ha-right-page" x1="330" y1="205" x2="572" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D43C8"/>
      <stop offset=".38" stop-color="#7265E4"/>
      <stop offset=".78" stop-color="#AFA3FA"/>
      <stop offset="1" stop-color="#D9D4FF"/>
    </linearGradient>
    <linearGradient id="nl-ha-right-back" x1="338" y1="210" x2="560" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3933A6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#AA9EF5" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="nl-ha-rim" x1="548" y1="48" x2="572" y2="311" gradientUnits="userSpaceOnUse">
