      <stop offset=".48" stop-color="#EAE7FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#BDB4FF" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="nl-ha-shadow-fill" x1="100" y1="318" x2="584" y2="397" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30286D" stop-opacity=".08"/>
      <stop offset=".48" stop-color="#433A92" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8D80E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nl-ha-right-shadow-fill" x1="330" y1="354" x2="606" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D2764" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7D70D7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nl-ha-ray-indigo" x1="332" y1="210" x2="635" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#786CE5" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#AA9FF4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D9D5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nl-ha-ray-warm" x1="332" y1="210" x2="635" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6C983" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFE8BA" stop-opacity="0"/>
