      <stop offset=".28" stop-color="#E9E5FF" stop-opacity=".38"/>
      <stop offset=".72" stop-color="#C6BEFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#B5ACFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="nl-ha-shadow" x="-25%" y="-40%" width="170%" height="210%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="nl-ha-card-shadow" x="-40%" y="-45%" width="190%" height="210%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#322A72" flood-opacity=".15"/>
    </filter>
    <filter id="nl-ha-soft-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
  .nl-ha-multi-stack,.nl-ha-progress-state,.nl-ha-empty-state{display:none}
  [data-state="new-multiple"] .nl-ha-multi-stack{display:inline}
  [data-state="continuation"] .nl-ha-completion-cue{display:none}
  [data-state="continuation"] .nl-ha-progress-state{display:inline}
  [data-state="continuation"] .nl-ha-source-fragments{opacity:.2}
  [data-state="empty"] .nl-ha-completion-cue,[data-state="empty"] .nl-ha-source-links,[data-state="empty"] .nl-ha-book-lines,[data-state="empty"] .nl-ha-source-fragments{display:none}
  [data-state="empty"] .nl-ha-empty-state{display:inline}
  [data-state="empty"] .nl-ha-book{opacity:.62}
</style>
